name: tibbi-local
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medical_booking}
      POSTGRES_USER: ${POSTGRES_USER:-medical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      target: migrator
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medical}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medical_booking}?schema=public
      DATABASE_URL_UNPOOLED: postgresql://${POSTGRES_USER:-medical}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medical_booking}?schema=public
    depends_on:
      db:
        condition: service_healthy
    profiles: ["migrations"]
    restart: "no"

  app:
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-medical}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medical_booking}?schema=public
      REDIS_URL: redis://redis:6379
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  notifications-worker:
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-medical}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medical_booking}?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["npm", "run", "notifications:worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    profiles: ["workers"]
    security_opt:
      - no-new-privileges:true

  booking-maintenance-worker:
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-medical}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medical_booking}?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["npm", "run", "bookings:maintenance"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    profiles: ["workers"]
    security_opt:
      - no-new-privileges:true

  availability-worker:
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-medical}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medical_booking}?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["npm", "run", "availability:worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    profiles: ["workers"]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  node_modules:
  next_cache:
